[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvox"
version = "0.1.0"
description = "All-in-one, fully offline voice engine: streaming STT, TTS, voice cloning, enrollment, enhancement, and an LLM voice-agent loop."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Zashiron", email = "zashiron.inc@gmail.com" }
]
maintainers = [
  { name = "Zashiron", email = "zashiron.inc@gmail.com" }
]
keywords = [
  "voice", "speech-to-text", "text-to-speech", "stt", "tts",
  "voice-cloning", "voice-agent", "offline", "on-device",
  "speech-recognition", "speech-synthesis", "whisper", "kokoro",
  "robotics", "edge-ai", "privacy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = ["numpy>=1.24", "platformdirs>=4.0"]

[project.optional-dependencies]
stt      = ["faster-whisper>=1.0.0", "pysilero-vad>=2.0.0", "sounddevice>=0.4.6", "huggingface_hub>=0.23"]
stt-demo = ["av>=11"]
tts      = ["kokoro-onnx>=0.5.0", "sounddevice>=0.4.6"]
# GPU TTS: onnxruntime-gpu + the CUDA 12 / cuDNN 9 runtime pip wheels, so no
# system CUDA install is required. Install EITHER tts (CPU) OR tts-gpu, not both
# (onnxruntime and onnxruntime-gpu conflict). The engine auto-selects CUDA when
# available and falls back to CPU otherwise.
# onnxruntime-gpu is pinned to the CUDA-12 build line: 1.28+ switched to CUDA 13
# and would mismatch these cu12 runtime wheels.
tts-gpu  = ["kokoro-onnx>=0.5.0", "sounddevice>=0.4.6",
            "onnxruntime-gpu>=1.22,<1.28",
            "nvidia-cudnn-cu12>=9.0", "nvidia-cuda-runtime-cu12>=12.0",
            "nvidia-cublas-cu12>=12.0", "nvidia-cufft-cu12>=11.0"]
clone    = ["chatterbox-tts>=0.1", "sounddevice>=0.4.6"]
enhance  = ["torch", "torchaudio", "matplotlib", "omegaconf", "pandas", "celluloid", "resampy", "soundfile", "rich", "tabulate"]
enroll   = ["openvox[clone,enhance]"]
agent    = ["openvox[stt,tts]"]
dev      = ["pytest>=8.0"]
all      = ["openvox[stt,stt-demo,tts]"]

[project.scripts]
openvox-stt-demo = "openvox.stt.demo:main"
openvox-tts-demo = "openvox.tts.demo:main"
openvox-clone-demo = "openvox.clone.demo:main"
openvox-enhance-demo = "openvox.enhance.demo:main"
openvox-enroll-demo = "openvox.enroll.demo:main"
openvox-agent-demo = "openvox.agent.demo:main"

[project.urls]
Homepage = "https://github.com/headlessripper/OpenVox"
Repository = "https://github.com/headlessripper/OpenVox"
Issues = "https://github.com/headlessripper/OpenVox/issues"

[tool.setuptools.packages.find]
include = ["openvox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs model download / real audio backend"]
